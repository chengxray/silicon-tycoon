<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <rect width="600" height="400" rx="16" fill="#0b1329" stroke="#0ea5e9" stroke-width="2"/>
  <circle cx="200" cy="200" r="140" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <!-- Wafer Flat / Notch -->
  <path d="M 60 200 A 140 140 0 1 0 340 200" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <!-- Die Grid -->
  <line x1="100" y1="120" x2="300" y2="120" stroke="#334155"/>
  <line x1="80" y1="160" x2="320" y2="160" stroke="#334155"/>
  <line x1="80" y1="200" x2="320" y2="200" stroke="#334155"/>
  <line x1="80" y1="240" x2="320" y2="240" stroke="#334155"/>
  <line x1="100" y1="280" x2="300" y2="280" stroke="#334155"/>
  <rect x="160" y="160" width="40" height="40" fill="#10b981" stroke="#34d399"/>
  <text x="180" y="185" fill="#ffffff" font-size="10" text-anchor="middle" font-family="sans-serif">Die</text>
  <!-- Labels -->
  <text x="460" y="120" fill="#38bdf8" font-size="16" font-weight="bold" font-family="sans-serif">【晶圓 Wafer 構造】</text>
  <text x="460" y="160" fill="#cbd5e1" font-size="13" font-family="sans-serif">• 矽晶圓（Wafer 8"/12"）</text>
  <text x="460" y="195" fill="#cbd5e1" font-size="13" font-family="sans-serif">• 晶粒（Die / Chip）</text>
  <text x="460" y="230" fill="#cbd5e1" font-size="13" font-family="sans-serif">• 切割道（Scribe Line）</text>
  <text x="460" y="265" fill="#cbd5e1" font-size="13" font-family="sans-serif">• 定位缺角（Notch）</text>
  <text x="300" y="370" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="sans-serif">半導體科普圖鑑 01：晶圓與晶粒微觀構造</text>
</svg>
