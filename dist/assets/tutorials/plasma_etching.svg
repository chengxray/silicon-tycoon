<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <rect width="600" height="400" rx="16" fill="#0b1329" stroke="#6366f1" stroke-width="2"/>
  <text x="300" y="45" fill="#818cf8" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">【蝕刻對比：乾式電漿 (RIE) vs 濕式酸槽】</text>

  <!-- Wet Etch (Isotropic) -->
  <rect x="40" y="80" width="240" height="230" rx="8" fill="#1e1b4b" stroke="#4f46e5"/>
  <text x="160" y="110" fill="#a5b4fc" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">濕式蝕刻 (等向性 Isotropic)</text>
  <path d="M 80 180 Q 110 240 160 240 Q 210 240 240 180" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
  <text x="160" y="270" fill="#f87171" font-size="11" text-anchor="middle" font-family="sans-serif">⚠️ 側向掏空 (Undercut)</text>
  <text x="160" y="290" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">無法製作 &lt; 1µm 細線寬</text>

  <!-- Dry Etch (Anisotropic) -->
  <rect x="320" y="80" width="240" height="230" rx="8" fill="#1e1b4b" stroke="#818cf8"/>
  <text x="440" y="110" fill="#c7d2fe" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">乾式電漿 (非等向性 Anisotropic)</text>
  <rect x="380" y="180" width="120" height="60" fill="#312e81" stroke="#818cf8" stroke-width="2"/>
  <line x1="410" y1="130" x2="410" y2="175" stroke="#f43f5e" stroke-width="2" stroke-dasharray="3"/>
  <line x1="440" y1="130" x2="440" y2="175" stroke="#f43f5e" stroke-width="2" stroke-dasharray="3"/>
  <line x1="470" y1="130" x2="470" y2="175" stroke="#f43f5e" stroke-width="2" stroke-dasharray="3"/>
  <text x="440" y="270" fill="#34d399" font-size="11" text-anchor="middle" font-family="sans-serif">✅ 垂直如刀削 (Vertical Wall)</text>
  <text x="440" y="290" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">奈米世代必備電漿反應離子蝕刻</text>

  <text x="300" y="360" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="sans-serif">半導體科普圖鑑 04：蝕刻輪廓與高深寬比物理</text>
</svg>
