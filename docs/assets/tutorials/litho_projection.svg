<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <rect width="600" height="400" rx="16" fill="#0b1329" stroke="#38bdf8" stroke-width="2"/>
  <text x="300" y="45" fill="#38bdf8" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">【微影光學與縮小投影 (Rayleigh CD)】</text>
  <!-- Optical Path -->
  <rect x="80" y="90" width="100" height="20" fill="#facc15" rx="4"/>
  <text x="130" y="105" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">光源 (λ)</text>
  
  <rect x="70" y="140" width="120" height="15" fill="#e2e8f0" stroke="#0284c7"/>
  <text x="130" y="152" fill="#0f172a" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">光罩 (Reticle / Mask)</text>

  <path d="M 90 155 L 120 220 L 140 220 L 170 155 Z" fill="#38bdf8" opacity="0.3"/>
  <ellipse cx="130" cy="220" rx="40" ry="15" fill="#0284c7" stroke="#38bdf8"/>
  <text x="130" y="224" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">透鏡 NA</text>

  <line x1="120" y1="235" x2="125" y2="280" stroke="#facc15" stroke-width="2"/>
  <line x1="140" y1="235" x2="135" y2="280" stroke="#facc15" stroke-width="2"/>
  <rect x="90" y="280" width="80" height="15" fill="#10b981"/>
  <text x="130" y="292" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">晶圓光阻層 (CD)</text>

  <rect x="250" y="90" width="310" height="220" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="405" y="125" fill="#38bdf8" font-size="16" font-weight="bold" text-anchor="middle" font-family="sans-serif">Rayleigh 極限公式</text>
  <text x="405" y="165" fill="#facc15" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">CD = k1 × (λ / NA)</text>
  <text x="270" y="205" fill="#cbd5e1" font-size="12" font-family="sans-serif">• k1：製程工藝因子 (0.80 → 0.28)</text>
  <text x="270" y="235" fill="#cbd5e1" font-size="12" font-family="sans-serif">• λ：光源波長 (436nm → 13.5nm)</text>
  <text x="270" y="265" fill="#cbd5e1" font-size="12" font-family="sans-serif">• NA：鏡頭數值孔徑 (0.116 → 0.55)</text>

  <text x="300" y="360" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="sans-serif">半導體科普圖鑑 03：微影光學與解析度極限</text>
</svg>
