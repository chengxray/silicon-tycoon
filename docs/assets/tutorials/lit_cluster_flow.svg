<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <rect width="600" height="400" rx="16" fill="#0b1329" stroke="#f59e0b" stroke-width="2"/>
  <text x="300" y="45" fill="#f59e0b" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">【LIT 黃光連線機組 Inline Cluster 三部曲】</text>
  
  <!-- Step 1: Track Coater -->
  <rect x="40" y="90" width="150" height="180" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="115" y="125" fill="#34d399" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">① Track 旋塗</text>
  <circle cx="115" cy="170" r="30" fill="#064e3b" stroke="#34d399"/>
  <text x="115" y="235" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">光阻均勻塗布</text>
  <text x="115" y="255" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="sans-serif">+ 軟烤 (PAB)</text>

  <path d="M 195 180 L 220 180" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 2: Scanner -->
  <rect x="225" y="90" width="150" height="180" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="300" y="125" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">② Scanner 曝光</text>
  <polygon points="300,145 325,190 275,190" fill="#0284c7" opacity="0.5"/>
  <text x="300" y="235" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">紫外光束聚焦</text>
  <text x="300" y="255" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="sans-serif">印上電路藍圖</text>

  <path d="M 380 180 L 405 180" stroke="#f59e0b" stroke-width="3"/>

  <!-- Step 3: Track Developer -->
  <rect x="410" y="90" width="150" height="180" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="485" y="125" fill="#34d399" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">③ Track 顯影</text>
  <circle cx="485" cy="170" r="30" fill="#064e3b" stroke="#34d399"/>
  <text x="485" y="235" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">顯影藥水洗出圖案</text>
  <text x="485" y="255" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="sans-serif">+ 硬烤固化</text>

  <rect x="40" y="300" width="520" height="70" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="300" y="330" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">💡 產線知識：每片晶圓在黃光區必須進出 Track 兩次！</text>
  <text x="300" y="350" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="sans-serif">單台 Track 是雙倍工位負荷，高階光刻機必須在介面勾選並聯 2~3 台 Track！</text>
</svg>
